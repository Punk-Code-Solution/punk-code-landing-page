
  <div class="default">
    <navbar></navbar>

    <section class="services-hero" [ngClass]="{'hero-animate': animatedElements.hero}">
      <div class="hero-content">
        <h1 [ngClass]="{'title-animate': animatedElements.hero}">Nossos Serviços</h1>
        <p [ngClass]="{'subtitle-animate': animatedElements.hero}">Oferecemos soluções digitais completas para transformar sua empresa e acelerar seus resultados</p>
      </div>
    </section>
  </div>

  <section class="service-list-container" [ngClass]="{'cards-animate': animatedElements.cards}">
    <div class="service-card"
         *ngFor="let service of services; let i = index"
         [ngClass]="{'card-appear': animatedElements.cards}"
         [style.animation-delay]="(i * 0.2) + 's'">

      <service-solution
        [icon]="service.icon"
        [title]="service.title"
        [description]="service.description"
        [features]="service.features">
      </service-solution>
    </div>
  </section>

  <section class="how-we-work-section" [ngClass]="{'section-animate': animatedElements.section}">
    <h2 [ngClass]="{'title-animate': animatedElements.section}">Como Trabalhamos</h2>
    <p [ngClass]="{'subtitle-animate': animatedElements.section}">Nosso processo é transparente e focado</p>

    <div class="steps-container" [ngClass]="{'steps-animate': animatedElements.steps}">
      <div class="step" 
           *ngFor="let step of [1,2,3,4]; let i = index"
           [ngClass]="{'step-appear': animatedElements.steps}"
           [style.animation-delay]="(i * 0.2) + 's'">
        <div class="step-icon-container">
          <i [class]="getStepIcon(i)"></i>
        </div>
        <h3>{{getStepTitle(i)}}</h3>
        <p>{{getStepDescription(i)}}</p>
      </div>
    </div>
  </section>

  <app-footer [ngClass]="{'footer-animate': animatedElements.footer}"></app-footer>
