<section id="contato" class="lead">
  <div class="container">
    <h2 revealOnScroll>Conte o desafio. A gente responde com o próximo passo certo.</h2>
    <div class="grid">
      <form class="reveal-from-left" revealOnScroll (ngSubmit)="enviarProposta()" novalidate>
        <div class="form-group">
          <label for="lead-nome">Nome *</label>
          <input id="lead-nome" name="nome" type="text" maxlength="150" [(ngModel)]="nome" required />
        </div>
        <div class="form-group">
          <label for="lead-email">E-mail *</label>
          <input
            id="lead-email"
            name="email"
            type="email"
            maxlength="150"
            [(ngModel)]="email"
            required
          />
        </div>
        <div class="form-group">
          <label for="lead-whatsapp">WhatsApp *</label>
          <input
            id="lead-whatsapp"
            name="telefone"
            type="tel"
            maxlength="50"
            [(ngModel)]="telefone"
            placeholder="(75) 9 8811-0732"
            required
          />
        </div>
        <div class="form-group">
          <label for="lead-interesse">Solução de Interesse *</label>
          <select id="lead-interesse" name="servico" [(ngModel)]="servico" required>
            <option value="" disabled>Selecione</option>
            @for (option of interestOptions; track option.value) {
              <option [value]="option.value">{{ option.label }}</option>
            }
          </select>
        </div>
        <div class="form-group">
          <label for="lead-mensagem">Mensagem (opcional)</label>
          <textarea
            id="lead-mensagem"
            name="mensagem"
            rows="4"
            maxlength="1000"
            [(ngModel)]="mensagem"
            placeholder="Conte um pouco sobre o desafio..."
          ></textarea>
        </div>
        <button type="submit" class="btn" [disabled]="isLoading">
          {{ isLoading ? 'Enviando...' : 'Enviar proposta' }}
        </button>
      </form>

      <aside class="reveal-from-right" revealOnScroll revealDelay="0.12s">
        <p>
          Prefere conversar agora? Chame no WhatsApp e diga qual solução te interessa.
        </p>
        <a class="btn btn-whatsapp" [href]="whatsappHref" target="_blank" rel="noopener noreferrer">
          Falar no WhatsApp agora
        </a>
      </aside>
    </div>
  </div>
</section>
