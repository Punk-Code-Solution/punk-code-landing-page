<section class="solutions-section" [ngClass]="{'fade-in': isAnimated}">
    <h1 class="solutions-title" [ngClass]="{'spiral-in-opcity': isAnimated}">Criamos Soluções para o Futuro</h1>
    <div class="solutions-grid">

      <div class="solution-card"
           *ngFor="let solution of solutions; let i = index"
           [ngClass]="{
             'card-appear': animatedCards[i],
             'card-hover': true
           }"
           [style.animation-delay]="(i * 0.3) + 's'">
        <div class="solution-icon" [ngClass]="{'icon-spin': animatedCards[i]}">
          <i [class]="solution.icon"></i>
        </div>
        <h3 class="solution-title">{{ solution.title }}</h3>
        <p class="solution-description">{{ solution.description }}</p>
        <div class="card-glow"></div>
        </div>

    </div>
  </section>
