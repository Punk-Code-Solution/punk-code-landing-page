name: Blog Radar

on:
  schedule:
    # 09:00 BRT (manhã)
    - cron: '0 12 * * *'
    # 12:00 BRT (meio-dia)
    - cron: '0 15 * * *'
    # 18:00 BRT (final da tarde)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Instalar dependências
        working-directory: Backend
        run: npm ci

      - name: Gerar 1 post radar
        working-directory: Backend
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run blog:radar -- --max=1

      - name: Commitar posts gerados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Backend/data/blog-posts.json
          if git diff --staged --quiet; then
            echo "Nenhum post novo para commitar."
          else
            git commit -m "chore(blog): atualizar posts radar via GitHub Actions"
            git push
          fi
